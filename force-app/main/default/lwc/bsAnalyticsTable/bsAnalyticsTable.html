<template>
  <lightning-card title="Analytics" icon-name="standard:data_graph">
    <template if:true={isLoading}>
      <div class="slds-p-around_medium">
        <lightning-spinner
          alternative-text="Loading Products"
          size="medium"
        ></lightning-spinner>
      </div>
    </template>

    <template if:true={errorMsg}>
      <div class="slds-p-around_medium slds-text-color_error">
        <lightning-icon
          icon-name="utility:error"
          alternative-text="Error"
          size="small"
        ></lightning-icon>
        {errorMsg}

        <!-- Retry Button -->
        <lightning-button
          label="Retry"
          variant="neutral"
          onclick={handleRetry}
          class="slds-m-left_small"
        >
        </lightning-button>
      </div>
    </template>

    <div if:false={errorMsg}>
      <template if:true={basicMetricsData}>
        <div style="margin-top: 12px; margin-bottom: 8px; font-size: 14px">
          <strong>Basic Metrics</strong>
        </div>
        <lightning-datatable
          key-field="id"
          data={basicMetricsData}
          columns={basicMetricsColumns}
          hide-checkbox-column="true"
        >
        </lightning-datatable>
      </template>

      <template if:true={monthlyMetricsData}>
        <div style="margin-top: 12px; margin-bottom: 8px; font-size: 14px">
          <strong>Monthly Data</strong>
        </div>
        <lightning-datatable
          key-field="id"
          data={monthlyMetricsData}
          columns={monthlyColumns}
          hide-checkbox-column="true"
        >
        </lightning-datatable>
      </template>

      <template if:true={quarterlyMetricsData}>
        <div style="margin-top: 12px; margin-bottom: 8px; font-size: 14px">
          <strong>Quarterly Data</strong>
        </div>
        <lightning-datatable
          key-field="id"
          data={quarterlyMetricsData}
          columns={quarterlyColumns}
          hide-checkbox-column="true"
        >
        </lightning-datatable>
      </template>
    </div>
  </lightning-card>
</template>

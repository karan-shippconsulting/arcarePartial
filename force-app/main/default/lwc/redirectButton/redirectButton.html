<template>
    <lightning-card>
        <div>
            <lightning-icon icon-name="standard:lead_list" size="medium" alternative-text="Assignment" class="slds-m-left_small slds-m-right_small"></lightning-icon>
            <span class="slds-text-heading_medium">Next Best Action</span>
        </div>
        <div class="slds-p-around_medium">
            <!-- Display Action Recommendation -->
            <div class="slds-box slds-box_xx-small slds-m-bottom_medium">
                <div class="slds-text-align_center">
                    <!-- Action Icon (can be dynamic) -->
                    <lightning-icon icon-name="standard:task" size="small" alternative-text="Action"
                        class="slds-m-bottom_small"></lightning-icon>

                    <!-- Title of Action -->
                    <h3 class="slds-text-heading_small">Follow Up with the uploaded document</h3>
                    <!-- Short Description of the Action -->
                    <p class="slds-text-body_regular">Review the uploaded document</p>

                    <!-- Action Button -->
                    <lightning-button label="Review Document" onclick={handleRedirect} variant="brand"
                        class="slds-m-top_medium">
                    </lightning-button>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
